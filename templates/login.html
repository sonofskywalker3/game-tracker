<!-- templates/login.html -->
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>BacklogQuest — Sign in</title>
  <link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
  <style>
    body { font-family: system-ui, sans-serif; background: #14141f; color: #eee;
           display: flex; min-height: 100vh; align-items: center; justify-content: center; margin: 0; }
    form { background: #1e1e2e; padding: 32px; border-radius: 12px; width: 280px; }
    h1 { font-size: 18px; margin: 0 0 16px; }
    input { width: 100%; box-sizing: border-box; padding: 10px; margin-bottom: 12px;
            border-radius: 8px; border: 1px solid #444; background: #2a2a3c; color: #fff; }
    .card { background: #1e1e2e; padding: 32px; border-radius: 12px; width: 280px; }
    a.btn { display: block; width: 100%; box-sizing: border-box; padding: 10px;
            border: none; border-radius: 8px; background: #7c3aed; color: #fff;
            font-weight: 600; cursor: pointer; text-align: center; text-decoration: none; }
    .err { color: #fca5a5; font-size: 13px; margin-bottom: 12px; }
  </style>
</head>
<body>
  <div class="card">
    <h1>BacklogQuest</h1>
    {% if error %}<div class="err">{{ error }}</div>{% endif %}
    <a class="btn" href="/auth/login">Sign in with Google</a>
  </div>
</body>
</html>
