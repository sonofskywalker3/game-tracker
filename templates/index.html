{% extends "base.html" %}

{% block title %}Library - Game Tracker{% endblock %}
{% block nav_library %}text-white bg-surface-lighter{% endblock %}

{% block content %}
<!-- Stats hero: stats left, mode switcher right -->
<div class="rounded-2xl mb-6 p-5 bg-gradient-to-br from-[#241b3a] via-[#191522] to-[#151515] border border-gray-700/50 flex flex-wrap items-center gap-4">
    <div id="hero-stats" class="flex gap-6">
        <!-- Filled by renderHeroStats() -->
    </div>
    <div id="mode-switcher" class="ml-auto flex gap-1.5 bg-black/30 border border-gray-700/60 rounded-xl p-1.5">
        <!-- Filled by renderModeBar() -->
    </div>
</div>

<!-- Filter row -->
<div class="flex flex-wrap items-center gap-2 mb-6">
    <input type="text" id="search-input" placeholder="Search..."
           class="w-48 bg-surface rounded-lg border border-gray-600 px-3 py-1.5 text-white text-sm placeholder-gray-500 focus:border-accent focus:outline-none">

    <!-- Status Filter -->
    <div class="relative" id="status-dropdown">
        <button type="button" onclick="toggleDropdown('status')"
                class="bg-surface rounded-lg border border-gray-600 px-2 py-1.5 text-white text-sm flex items-center gap-1">
            <span id="status-label">Status</span>
            <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"/></svg>
        </button>
        <div id="status-options" class="absolute z-50 mt-1 w-40 bg-surface-light border border-gray-700 rounded-lg shadow-lg hidden">
            <label class="flex items-center gap-2 px-3 py-1.5 hover:bg-surface cursor-pointer"><input type="checkbox" value="backlog" checked class="status-check accent-accent w-3.5 h-3.5"><span class="text-white text-sm">Backlog</span></label>
            <label class="flex items-center gap-2 px-3 py-1.5 hover:bg-surface cursor-pointer"><input type="checkbox" value="playing" checked class="status-check accent-accent w-3.5 h-3.5"><span class="text-white text-sm">Playing</span></label>
            <label class="flex items-center gap-2 px-3 py-1.5 hover:bg-surface cursor-pointer"><input type="checkbox" value="parked" checked class="status-check accent-accent w-3.5 h-3.5"><span class="text-white text-sm">Parked</span></label>
            <label class="flex items-center gap-2 px-3 py-1.5 hover:bg-surface cursor-pointer"><input type="checkbox" value="completed" checked class="status-check accent-accent w-3.5 h-3.5"><span class="text-white text-sm">Complete</span></label>
            <label class="flex items-center gap-2 px-3 py-1.5 hover:bg-surface cursor-pointer"><input type="checkbox" value="100" checked class="status-check accent-accent w-3.5 h-3.5"><span class="text-white text-sm">100%</span></label>
            <label class="flex items-center gap-2 px-3 py-1.5 hover:bg-surface cursor-pointer"><input type="checkbox" value="dropped" class="status-check accent-accent w-3.5 h-3.5"><span class="text-white text-sm">Dropped</span></label>
            <label class="flex items-center gap-2 px-3 py-1.5 hover:bg-surface cursor-pointer"><input type="checkbox" value="wishlist" class="status-check accent-accent w-3.5 h-3.5"><span class="text-white text-sm">Wishlist</span></label>
        </div>
    </div>

    <!-- Platform Filter -->
    <div class="relative" id="platform-dropdown">
        <button type="button" onclick="toggleDropdown('platform')"
                class="bg-surface rounded-lg border border-gray-600 px-2 py-1.5 text-white text-sm flex items-center gap-1">
            <span id="platform-label">Platforms</span>
            <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"/></svg>
        </button>
        <div id="platform-options" class="absolute z-50 mt-1 w-40 bg-surface-light border border-gray-700 rounded-lg shadow-lg hidden"></div>
    </div>

    <!-- Rating Filter -->
    <div class="relative" id="rating-dropdown">
        <button type="button" onclick="toggleDropdown('rating')"
                class="bg-surface rounded-lg border border-gray-600 px-2 py-1.5 text-white text-sm flex items-center gap-1">
            <span id="rating-label">Rating</span>
            <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"/></svg>
        </button>
        <div id="rating-options" class="absolute z-50 mt-1 w-40 bg-surface-light border border-gray-700 rounded-lg shadow-lg hidden">
            <label class="flex items-center gap-2 px-3 py-1.5 hover:bg-surface cursor-pointer"><input type="checkbox" value="4" checked class="rating-check accent-accent w-3.5 h-3.5"><span class="text-white text-sm">❤️ Loved</span></label>
            <label class="flex items-center gap-2 px-3 py-1.5 hover:bg-surface cursor-pointer"><input type="checkbox" value="3" checked class="rating-check accent-accent w-3.5 h-3.5"><span class="text-white text-sm">👍 Liked</span></label>
            <label class="flex items-center gap-2 px-3 py-1.5 hover:bg-surface cursor-pointer"><input type="checkbox" value="2" checked class="rating-check accent-accent w-3.5 h-3.5"><span class="text-white text-sm">😐 Meh</span></label>
            <label class="flex items-center gap-2 px-3 py-1.5 hover:bg-surface cursor-pointer"><input type="checkbox" value="1" checked class="rating-check accent-accent w-3.5 h-3.5"><span class="text-white text-sm">👎 Hated</span></label>
            <label class="flex items-center gap-2 px-3 py-1.5 hover:bg-surface cursor-pointer"><input type="checkbox" value="unrated" checked class="rating-check accent-accent w-3.5 h-3.5"><span class="text-white text-sm">Unrated</span></label>
        </div>
    </div>

    <!-- Sort -->
    <select id="sort-select" class="bg-surface rounded-lg border border-gray-600 px-2 py-1.5 text-white text-sm focus:border-accent focus:outline-none">
        <option value="title">Sort: Name</option>
        <option value="rating">Sort: Rating</option>
        <option value="priority">Sort: Priority</option>
        <option value="metacritic">Sort: Metacritic</option>
    </select>
</div>

<!-- Alphabet Bar - Fixed to left edge -->
<div id="alphabet-bar" class="hidden lg:flex fixed left-0 top-1/2 -translate-y-1/2 flex-col items-center py-4 px-1 z-30"></div>

<!-- Game Grid -->
<div id="games-grid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 xl:grid-cols-6 2xl:grid-cols-8 gap-4 lg:ml-8"></div>

<div id="loading-state" class="text-center py-12"><div class="animate-pulse text-gray-500">Loading games...</div></div>
<div id="empty-state" class="hidden text-center py-12">
    <div class="text-6xl mb-4">🎮</div>
    <h3 class="text-xl font-medium text-gray-400" id="empty-title">No games found</h3>
    <p class="text-gray-500 mt-2" id="empty-subtitle">Try adjusting your filters</p>
</div>
{% endblock %}

{% block scripts %}
<script>
    let allGames = [];
    let debounceTimer;

    // Temporary no-op stubs (replaced by real implementations in Task 5).
    function saveViewState() {}
    function restoreViewState() {}

    // ---- Library view modes ----
    const MODES = [
        { id: 'all',      label: 'All',     match: () => true },
        { id: 'modern',   label: 'Modern',  match: g => (g.categories || []).includes('modern_console') },
        { id: 'legacy',   label: 'Legacy',  match: g => (g.categories || []).includes('legacy_console') },
        { id: 'pc',       label: 'PC',      match: g => (g.categories || []).includes('pc') },
        { id: 'physical', label: 'Physical', match: g => !!g.physical },
    ];
    let currentMode = 'all';

    function modeCount(mode) {
        return allGames.filter(mode.match).length;
    }

    function renderModeBar() {
        const bar = document.getElementById('mode-switcher');
        bar.innerHTML = MODES.map(m => {
            const count = modeCount(m);
            const active = m.id === currentMode;
            const empty = count === 0;
            return `<button onclick="setMode('${m.id}')"
                class="px-3 py-1.5 rounded-lg text-sm whitespace-nowrap transition-colors
                       ${active ? 'bg-accent text-white' : 'text-gray-300 hover:bg-surface-light'}
                       ${empty && !active ? 'opacity-50' : ''}">
                ${m.label} <span class="opacity-60 text-xs">${count}</span>
            </button>`;
        }).join('');
    }

    function setMode(modeId) {
        currentMode = modeId;
        renderModeBar();
        filterAndRenderGames();
        saveViewState();
    }

    function renderHeroStats(stats) {
        const done = stats.total_games
            ? Math.round(((stats.by_status?.completed || 0) + (stats.by_status?.['100'] || 0)) / stats.total_games * 100)
            : 0;
        const tiles = [
            ['total_games', stats.total_games || 0, 'games'],
            ['completed', stats.by_status?.completed || 0, 'completed'],
            ['playing', stats.by_status?.playing || 0, 'playing'],
            ['backlog', stats.by_status?.backlog || 0, 'backlog'],
            ['done', done + '%', 'done'],
        ];
        document.getElementById('hero-stats').innerHTML = tiles.map(([, v, label]) =>
            `<div><div class="text-2xl font-bold text-white leading-none">${v}</div>
                  <div class="text-xs text-gray-400 mt-1">${label}</div></div>`
        ).join('');
    }

    async function loadHeroStats() {
        const stats = await api.get('/api/stats');
        if (stats) renderHeroStats(stats);
    }

    function toggleDropdown(type) {
        const options = document.getElementById(`${type}-options`);
        const isHidden = options.classList.contains('hidden');

        // Close all dropdowns first
        document.querySelectorAll('#status-options, #platform-options, #rating-options').forEach(el => el.classList.add('hidden'));

        if (isHidden) {
            options.classList.remove('hidden');
        }
    }

    // Close dropdowns when clicking outside
    document.addEventListener('click', (e) => {
        if (!e.target.closest('#status-dropdown') && !e.target.closest('#platform-dropdown') && !e.target.closest('#rating-dropdown')) {
            document.querySelectorAll('#status-options, #platform-options, #rating-options').forEach(el => el.classList.add('hidden'));
        }
    });

    function getSelectedStatuses() {
        return Array.from(document.querySelectorAll('.status-check:checked')).map(cb => cb.value);
    }

    function getSelectedPlatforms() {
        return Array.from(document.querySelectorAll('.platform-check:checked')).map(cb => cb.value);
    }

    function getSelectedRatings() {
        return Array.from(document.querySelectorAll('.rating-check:checked')).map(cb => cb.value);
    }

    function updateFilterLabels() {
        const statuses = getSelectedStatuses();
        const platforms = getSelectedPlatforms();
        const totalStatuses = document.querySelectorAll('.status-check').length;
        const totalPlatforms = document.querySelectorAll('.platform-check').length;

        document.getElementById('status-label').textContent =
            statuses.length === totalStatuses ? 'Status' :
            statuses.length === 0 ? 'None' :
            `Status (${statuses.length})`;

        document.getElementById('platform-label').textContent =
            platforms.length === totalPlatforms ? 'Platforms' :
            platforms.length === 0 ? 'None' :
            `Platforms (${platforms.length})`;

        const ratings = getSelectedRatings();
        const totalRatings = document.querySelectorAll('.rating-check').length;
        document.getElementById('rating-label').textContent =
            ratings.length === totalRatings ? 'Rating' :
            ratings.length === 0 ? 'None' :
            `Rating (${ratings.length})`;
    }

    async function loadGames() {
        const games = await api.get('/api/games');
        allGames = games;
        renderModeBar();
        filterAndRenderGames();
    }

    function filterAndRenderGames() {
        const search = document.getElementById('search-input').value.toLowerCase();
        const statuses = getSelectedStatuses();
        const platforms = getSelectedPlatforms();
        const ratings = getSelectedRatings();
        const mode = MODES.find(m => m.id === currentMode) || MODES[0];
        const sort = document.getElementById('sort-select').value;

        let filtered = allGames.filter(game => {
            if (!mode.match(game)) return false;
            if (statuses.length > 0 && !statuses.includes(game.status || 'backlog')) return false;
            if (platforms.length > 0) {
                const gp = (game.platforms || []);
                if (!gp.some(p => platforms.includes(p))) return false;
            }
            if (ratings.length > 0) {
                const key = game.rating ? String(game.rating) : 'unrated';
                if (!ratings.includes(key)) return false;
            }
            if (search && !game.title.toLowerCase().includes(search)) return false;
            return true;
        });

        filtered = sortGames(filtered, sort);

        updateFilterLabels();
        renderGames(filtered);
        updateAlphabetBar(filtered);
        updateEmptyState(filtered.length, mode);
    }

    function sortGames(games, sort) {
        const arr = [...games];
        if (sort === 'rating')      arr.sort((a, b) => (b.rating || 0) - (a.rating || 0));
        else if (sort === 'priority') arr.sort((a, b) => (b.priority || 0) - (a.priority || 0));
        else if (sort === 'metacritic') arr.sort((a, b) => (b.metacritic_score || 0) - (a.metacritic_score || 0));
        else arr.sort((a, b) => (a.series_name || a.title).localeCompare(b.series_name || b.title));
        return arr;
    }

    function updateEmptyState(count, mode) {
        const empty = document.getElementById('empty-state');
        if (count > 0) { empty.classList.add('hidden'); return; }
        const emptyModes = {
            legacy: ['No legacy games yet', 'These fill in when you import your older-console libraries.'],
            pc: ['No PC games yet', 'These fill in when you import your Steam / GOG / Epic libraries.'],
        };
        const [title, subtitle] = emptyModes[mode.id] || ['No games found', 'Try adjusting your filters'];
        document.getElementById('empty-title').textContent = title;
        document.getElementById('empty-subtitle').textContent = subtitle;
        empty.classList.remove('hidden');
    }

    function renderGames(games) {
        const grid = document.getElementById('games-grid');
        const loading = document.getElementById('loading-state');
        const empty = document.getElementById('empty-state');

        loading.classList.add('hidden');

        if (!games.length) {
            grid.innerHTML = '';
            empty.classList.remove('hidden');
            return;
        }

        empty.classList.add('hidden');

        grid.innerHTML = games.map(game => {
            const coverUrl = game.cover_url || '';
            const isPhysical = (game.tags || []).some(t => t.name === 'Physical');
            const sortName = game.series_name || game.title;

            return `
                <div class="game-card bg-surface-light rounded-lg overflow-hidden cursor-pointer"
                     data-game-id="${game.id}"
                     data-sort-name="${sortName.replace(/"/g, '&quot;')}"
                     onclick="openModal(${game.id})">
                    <div class="aspect-[3/4] relative overflow-hidden">
                        ${coverUrl ? `
                            <img src="${coverUrl}" alt="${game.title}"
                                 class="w-full h-full object-cover"
                                 onerror="this.parentElement.innerHTML='<div class=\\'cover-placeholder w-full h-full flex items-center justify-center\\'><span class=\\'text-4xl\\'>🎮</span></div>'">
                        ` : `
                            <div class="cover-placeholder w-full h-full flex items-center justify-center border-2 border-dashed border-gray-600">
                                <span class="text-4xl">🎮</span>
                            </div>
                        `}
                        <!-- Physical disc icon -->
                        ${isPhysical ? `
                            <div class="absolute top-2 right-2 bg-black/50 rounded-full w-6 h-6 flex items-center justify-center" title="Physical Copy">
                                <svg class="w-4 h-4 text-white/80" viewBox="0 0 24 24" fill="currentColor">
                                    <circle cx="12" cy="12" r="10" fill="none" stroke="currentColor" stroke-width="1.5"/>
                                    <circle cx="12" cy="12" r="3" fill="currentColor"/>
                                </svg>
                            </div>
                        ` : ''}
                    </div>
                    <div class="p-3 relative">
                        <h3 class="font-medium text-sm text-white leading-tight line-clamp-2 min-h-[2.5rem]" title="${game.title}">${game.title}</h3>
                        <!-- Rating emoji -->
                        ${game.rating ? `
                            <div class="absolute bottom-2 right-2 text-base" title="${game.rating === 1 ? 'Hated it' : game.rating === 2 ? 'Meh' : game.rating === 3 ? 'Liked it' : 'Loved it'}">
                                ${game.rating === 1 ? '👎' : game.rating === 2 ? '😐' : game.rating === 3 ? '👍' : '❤️'}
                            </div>
                        ` : ''}
                        <div class="mt-2 flex flex-wrap items-center gap-1">
                            ${(game.platforms || []).map(p =>
                                `<span class="platform-badge platform-${p}">${p}</span>`
                            ).join('')}
                            <span class="status-badge status-${game.status || 'backlog'}">${game.status === '100' ? '100%' : game.status === 'completed' ? 'complete' : (game.status || 'backlog').replace('_', ' ')}</span>
                        </div>
                    </div>
                </div>
            `;
        }).join('');
    }

    async function loadPlatforms() {
        const platforms = await api.get('/api/platforms');
        const container = document.getElementById('platform-options');
        const platformOrder = ['PS4', 'PS5', 'Switch', 'Xbox'];

        const sorted = platforms
            .filter(p => p.short_name !== 'PC' && p.game_count > 0)
            .sort((a, b) => platformOrder.indexOf(a.short_name) - platformOrder.indexOf(b.short_name));

        container.innerHTML = sorted.map(p => `
            <label class="flex items-center gap-2 px-3 py-2 hover:bg-surface cursor-pointer">
                <input type="checkbox" value="${p.short_name}" checked class="platform-check accent-accent w-4 h-4">
                <span class="text-white text-sm">${p.short_name}</span>
            </label>
        `).join('');

        // Add event listeners to new checkboxes
        container.querySelectorAll('.platform-check').forEach(cb => {
            cb.addEventListener('change', filterAndRenderGames);
        });
    }

    function refreshGameList() {
        loadGames();
    }

    let alphabetAvailableLetters = new Set();

    function updateAlphabetBar(games) {
        const bar = document.getElementById('alphabet-bar');
        const letters = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ#'.split('');

        // Find which letters have games (use series name if available)
        alphabetAvailableLetters = new Set();
        games.forEach(game => {
            const sortName = game.series_name || game.title;
            const firstChar = sortName.charAt(0).toUpperCase();
            if (/[A-Z]/.test(firstChar)) {
                alphabetAvailableLetters.add(firstChar);
            } else {
                alphabetAvailableLetters.add('#');
            }
        });

        bar.innerHTML = letters.map(letter => {
            const hasGames = alphabetAvailableLetters.has(letter);
            return `<button data-letter="${letter}" class="alphabet-letter w-7 h-7 flex items-center justify-center rounded text-sm font-semibold transition-all ${hasGames ? 'text-gray-500 hover:text-white hover:bg-surface-light cursor-pointer' : 'text-gray-800 cursor-default'}"
                            ${hasGames ? `onclick="scrollToLetter('${letter}')"` : 'disabled'}>${letter}</button>`;
        }).join('');

        // Initial highlight
        updateCurrentLetter();
    }

    function scrollToLetter(letter) {
        const cards = document.querySelectorAll('.game-card');
        for (const card of cards) {
            const sortName = card.dataset.sortName || card.querySelector('h3').textContent;
            const firstChar = sortName.charAt(0).toUpperCase();
            const matches = letter === '#'
                ? !/[A-Z]/.test(firstChar)
                : firstChar === letter;

            if (matches) {
                card.scrollIntoView({ behavior: 'smooth', block: 'center' });
                card.classList.add('ring-2', 'ring-accent');
                setTimeout(() => card.classList.remove('ring-2', 'ring-accent'), 1000);
                break;
            }
        }
    }

    function updateCurrentLetter() {
        const cards = document.querySelectorAll('.game-card');
        if (!cards.length) return;

        const viewportMiddle = window.innerHeight / 2;
        let currentLetter = null;

        // Find the card closest to the middle of the viewport
        let closestDistance = Infinity;
        for (const card of cards) {
            const rect = card.getBoundingClientRect();
            const cardMiddle = rect.top + rect.height / 2;
            const distance = Math.abs(cardMiddle - viewportMiddle);

            if (distance < closestDistance) {
                closestDistance = distance;
                const sortName = card.dataset.sortName || card.querySelector('h3').textContent;
                const firstChar = sortName.charAt(0).toUpperCase();
                currentLetter = /[A-Z]/.test(firstChar) ? firstChar : '#';
            }
        }

        // Update highlighting
        document.querySelectorAll('.alphabet-letter').forEach(btn => {
            const letter = btn.dataset.letter;
            const isActive = letter === currentLetter;
            const hasGames = alphabetAvailableLetters.has(letter);

            btn.classList.toggle('text-accent', isActive);
            btn.classList.toggle('bg-accent/20', isActive);
            btn.classList.toggle('text-gray-500', !isActive && hasGames);
            btn.classList.toggle('text-gray-800', !isActive && !hasGames);
        });
    }

    // Scroll listener for tracking current letter
    let scrollTimeout;
    window.addEventListener('scroll', () => {
        clearTimeout(scrollTimeout);
        scrollTimeout = setTimeout(updateCurrentLetter, 50);
    });

    // Event listeners
    document.getElementById('search-input').addEventListener('input', () => {
        clearTimeout(debounceTimer);
        debounceTimer = setTimeout(filterAndRenderGames, 300);
    });

    document.querySelectorAll('.status-check').forEach(cb => {
        cb.addEventListener('change', filterAndRenderGames);
    });

    document.querySelectorAll('.rating-check').forEach(cb => {
        cb.addEventListener('change', () => { filterAndRenderGames(); saveViewState(); });
    });

    // Initialize
    document.addEventListener('DOMContentLoaded', () => {
        restoreViewState();   // defined in Task 5
        loadPlatforms();
        loadHeroStats();
        loadGames();
        document.getElementById('sort-select').addEventListener('change', () => {
            filterAndRenderGames();
            saveViewState();   // defined in Task 5
        });
    });
</script>
<style>
    .line-clamp-2 {
        display: -webkit-box;
        -webkit-line-clamp: 2;
        -webkit-box-orient: vertical;
        overflow: hidden;
    }
    #alphabet-bar {
        background: linear-gradient(to right, rgba(30, 30, 35, 0.95), rgba(30, 30, 35, 0));
        padding-right: 1rem;
    }
</style>
{% endblock %}
