{% extends "base.html" %}

{% block title %}What to Play - Game Tracker{% endblock %}
{% block nav_recommendations %}text-white bg-surface-lighter{% endblock %}

{% block content %}
<div class="space-y-8">
    <div>
        <h2 class="text-xl font-bold text-white mb-3">Your Slate</h2>
        <div id="slate" class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-4 gap-4"></div>
    </div>

    <div id="recently-finished-section" class="hidden">
        <h2 class="text-xl font-bold text-white mb-3">Recently Finished</h2>
        <div id="recently-finished" class="flex flex-wrap gap-3"></div>
    </div>

    <div id="needs-rating-section" class="hidden">
        <h2 class="text-xl font-bold text-white mb-3">Needs Rating</h2>
        <div id="needs-rating-grid" class="grid grid-cols-[repeat(auto-fill,minmax(190px,1fr))] gap-4"></div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
    let _slateData = [];
    let _seriesList = [];
    const _searchTimers = {};

    async function loadSlate() {
        const [slotsResp, games, series] = await Promise.all([
            api.get('/api/slots'),
            api.get('/api/games'),
            api.get('/api/series'),
        ]);
        _slateData = slotsResp.slots || [];
        _seriesList = (series || []).map(s => ({ id: s.id, name: s.name }));
        renderSlate(_slateData);
        renderRecentlyFinished(slotsResp.recently_finished || []);
        const needsRating = (games || []).filter(g =>
            g.status && g.status !== 'backlog' && g.status !== 'wishlist' && !g.rating);
        renderNeedsRating(needsRating);
    }
    // base.html's closeModal calls refreshGameList() on close -> re-rank.
    function refreshGameList() { loadSlate(); }

    function slotChip(slot) {
        const parts = [];
        let plats = [];
        try { plats = JSON.parse(slot.platforms || '[]'); } catch (e) { plats = []; }
        if (plats.length) parts.push(plats.join('/'));
        if (slot.max_session_minutes) parts.push('<' + slot.max_session_minutes + 'm');
        else if (slot.min_session_minutes) parts.push(slot.min_session_minutes + 'm+');
        if (slot.streamable_only) parts.push('stream-safe');
        return parts.join(' · ');
    }

    function renderSlate(slots) {
        document.getElementById('slate').innerHTML = slots.map(slotCardHtml).join('')
            + `<button onclick="addSlot()" class="game-card bg-surface-light/40 rounded-lg border-2 border-dashed border-gray-700 hover:border-accent flex items-center justify-center min-h-[120px] text-gray-400 hover:text-white text-sm">+ Add slot</button>`;
    }

    function slotCardHtml(slot) {
        const g = slot.current_game;
        const current = g ? `
            <div class="flex gap-3">
                <div class="w-16 flex-shrink-0 cursor-pointer" onclick="openModal(${g.id})">
                    <div class="aspect-[3/4] rounded overflow-hidden">
                        ${g.cover_url ? `<img src="${g.cover_url}" alt="" class="w-full h-full object-cover">`
                                      : `<div class="cover-placeholder w-full h-full flex items-center justify-center">🎮</div>`}
                    </div>
                </div>
                <div class="flex-1 min-w-0">
                    <p class="text-sm font-medium text-white truncate cursor-pointer" onclick="openModal(${g.id})" title="${escapeHtml(g.title)}">${escapeHtml(g.title)}</p>
                    <input type="text" value="${escapeHtml(slot.goal || '')}" placeholder="set a goal"
                           class="mt-1 w-full bg-surface rounded border border-gray-700 px-2 py-1 text-xs text-accent focus:border-accent focus:outline-none"
                           onchange="editGoal(${slot.id}, this.value)">
                    <div id="slot-actions-${slot.id}" class="mt-2 flex flex-wrap gap-1 text-xs">
                        <button onclick="beatPrompt(${slot.id})" class="px-2 py-1 bg-surface rounded hover:bg-surface-lighter">Beat</button>
                        <button onclick="slotOutcome(${slot.id},'complete')" class="px-2 py-1 bg-surface rounded hover:bg-surface-lighter">Complete</button>
                        <button onclick="slotOutcome(${slot.id},'dropped')" class="px-2 py-1 bg-surface rounded hover:bg-surface-lighter">Dropped</button>
                        <button onclick="slotOutcome(${slot.id},'swap')" class="px-2 py-1 bg-surface rounded hover:bg-surface-lighter">Swap</button>
                    </div>
                </div>
            </div>` : `
            <div>
                <p class="text-sm text-gray-400">Empty — search or pick a suggestion.</p>
                <button onclick="toggleDeciderChat(${slot.id})" id="decider-btn-${slot.id}"
                        class="mt-2 px-2 py-1 bg-surface rounded hover:bg-surface-lighter text-xs text-gray-300">Help me decide</button>
            </div>
            <div id="decider-chat-${slot.id}" class="hidden mt-3">
                <div id="decider-msgs-${slot.id}"
                     class="bg-surface rounded-lg border border-gray-700 p-2 space-y-2 max-h-64 overflow-y-auto text-xs"></div>
                <div class="flex gap-1">
                    <input type="text" id="decider-input-${slot.id}"
                           placeholder="Ask me anything about your backlog…"
                           class="flex-1 bg-surface rounded border border-gray-700 px-2 py-1 text-white text-xs placeholder-gray-600 focus:border-accent focus:outline-none"
                           onkeydown="if(event.key==='Enter') sendDeciderMessage(${slot.id})">
                    <button onclick="sendDeciderMessage(${slot.id})"
                            class="px-2 py-1 bg-accent hover:bg-accent-hover rounded text-white text-xs">Send</button>
                </div>
            </div>`;

        const sugg = (slot.candidates || []).slice(0, 5).map(c => `
            <div class="flex items-center gap-2 py-1">
                <div class="w-7 flex-shrink-0 cursor-pointer" onclick="openModal(${c.game.id})">
                    <div class="aspect-[3/4] rounded overflow-hidden">
                        ${c.game.cover_url ? `<img src="${c.game.cover_url}" class="w-full h-full object-cover">`
                                           : `<div class="cover-placeholder w-full h-full flex items-center justify-center text-xs">🎮</div>`}
                    </div>
                </div>
                <div class="flex-1 min-w-0 cursor-pointer" onclick="openModal(${c.game.id})">
                    <p class="text-xs text-gray-200 truncate" title="${escapeHtml(c.game.title)}">${escapeHtml(c.game.title)}</p>
                    ${(c.reasons && c.reasons.length) ? `<p class="text-[10px] text-gray-500 truncate">${escapeHtml(c.reasons[0])}</p>` : ''}
                </div>
                <button onclick="pinFromSuggestion(${slot.id}, ${c.game.id})" title="Pin" class="text-green-400 hover:text-green-300 px-1">✓</button>
                <button onclick="dismissSuggestion(${slot.id}, ${c.game.id})" title="Dismiss" class="text-gray-500 hover:text-red-400 px-1">✕</button>
            </div>`).join('') || `<p class="text-xs text-gray-600">No suggestions.</p>`;

        return `<div class="bg-surface-light rounded-lg p-4 flex flex-col">
            <div class="flex items-center justify-between mb-1">
                <h3 class="font-medium text-white text-sm">${escapeHtml(slot.label)}</h3>
                <button onclick="toggleSlotSettings(${slot.id})" title="Slot settings" class="text-gray-500 hover:text-white">⚙</button>
            </div>
            <p class="text-xs text-gray-500 mb-3">${escapeHtml(slotChip(slot))}</p>
            <div id="slot-settings-${slot.id}" class="hidden"></div>
            ${current}
            <div class="relative mt-3">
                <input type="text" id="search-${slot.id}" placeholder="Search any game to pin…" autocomplete="off"
                       class="w-full bg-surface rounded-lg border border-gray-600 px-3 py-1.5 text-white text-sm placeholder-gray-500 focus:border-accent focus:outline-none"
                       oninput="slotSearch(${slot.id}, this.value)">
                <div id="search-results-${slot.id}" class="hidden absolute z-40 left-0 right-0 mt-1 bg-surface-light border border-gray-700 rounded-lg shadow-lg max-h-64 overflow-y-auto"></div>
            </div>
            <div class="mt-3 space-y-1">${sugg}</div>
        </div>`;
    }

    function beatPrompt(slotId) {
        const el = document.getElementById('slot-actions-' + slotId);
        if (!el) return;
        el.innerHTML = `
            <span class="text-gray-400 self-center">Beaten —</span>
            <input type="text" id="chase-goal-${slotId}" value="get the plat" class="bg-surface rounded border border-gray-700 px-2 py-1 text-xs text-white w-28">
            <button onclick="chaseBeat(${slotId})" class="px-2 py-1 bg-surface rounded hover:bg-surface-lighter">Chase</button>
            <button onclick="slotOutcome(${slotId},'beat')" class="px-2 py-1 bg-surface rounded hover:bg-surface-lighter">Shelve</button>`;
    }
    async function chaseBeat(slotId) {
        const goal = (document.getElementById('chase-goal-' + slotId) || {}).value || null;
        await api.post(`/api/slots/${slotId}/outcome`, { outcome: 'beat', chase: true, new_goal: goal });
        loadSlate();
    }
    async function slotOutcome(slotId, outcome) {
        await api.post(`/api/slots/${slotId}/outcome`, { outcome });
        loadSlate();
    }
    async function editGoal(slotId, goal) {
        await api.patch(`/api/slots/${slotId}/goal`, { goal });
    }
    async function pinFromSuggestion(slotId, gameId) {
        await api.post(`/api/slots/${slotId}/pin`, { game_id: gameId });
        loadSlate();
    }
    async function dismissSuggestion(slotId, gameId) {
        await api.post(`/api/slots/${slotId}/dismiss`, { game_id: gameId });
        loadSlate();
    }

    function slotSearch(slotId, q) {
        clearTimeout(_searchTimers[slotId]);
        const box = document.getElementById('search-results-' + slotId);
        if (!q || q.length < 2) { box.classList.add('hidden'); box.innerHTML = ''; return; }
        _searchTimers[slotId] = setTimeout(async () => {
            const results = await api.get('/api/games/search?q=' + encodeURIComponent(q));
            if (!results.length) { box.innerHTML = '<p class="px-3 py-2 text-xs text-gray-500">No matches.</p>'; }
            else box.innerHTML = results.map(r => `
                <button onclick="pinSearchResult(${slotId}, ${r.id})" class="w-full flex items-center gap-2 px-3 py-2 text-left hover:bg-surface">
                    <div class="w-6 flex-shrink-0"><div class="aspect-[3/4] rounded overflow-hidden">
                        ${r.cover_url ? `<img src="${r.cover_url}" class="w-full h-full object-cover">` : `<div class="cover-placeholder w-full h-full flex items-center justify-center text-[10px]">🎮</div>`}
                    </div></div>
                    <span class="flex-1 min-w-0 text-sm text-white truncate">${escapeHtml(r.title)}</span>
                    <span class="text-[10px] text-gray-500">${(r.platforms || []).join('/')}</span>
                </button>`).join('');
            box.classList.remove('hidden');
        }, 200);
    }
    async function pinSearchResult(slotId, gameId) {
        await api.post(`/api/slots/${slotId}/pin`, { game_id: gameId });
        loadSlate();
    }

    function renderRecentlyFinished(items) {
        const section = document.getElementById('recently-finished-section');
        const box = document.getElementById('recently-finished');
        if (!items.length) { section.classList.add('hidden'); return; }
        section.classList.remove('hidden');
        box.innerHTML = items.map(it => `
            <div class="flex items-center gap-2 bg-surface-light rounded-lg px-3 py-2 cursor-pointer hover:bg-surface-lighter" onclick="openModal(${it.game_id})">
                <div class="w-6 flex-shrink-0"><div class="aspect-[3/4] rounded overflow-hidden">
                    ${it.cover_url ? `<img src="${it.cover_url}" class="w-full h-full object-cover">` : `<div class="cover-placeholder w-full h-full flex items-center justify-center text-[10px]">🎮</div>`}
                </div></div>
                <span class="text-sm text-gray-200">${escapeHtml(it.title)}</span>
                <span class="text-xs text-gray-500">${escapeHtml(it.outcome)}</span>
            </div>`).join('');
    }

    function renderNeedsRating(games) {
        const section = document.getElementById('needs-rating-section');
        const grid = document.getElementById('needs-rating-grid');
        if (!games.length) { section.classList.add('hidden'); return; }
        section.classList.remove('hidden');
        grid.innerHTML = games.map(gameCardHtml).join('');
    }

    const SLOT_PLATFORMS = ['Switch', 'PS', 'Xbox', 'Steam', 'PC'];

    function toggleSlotSettings(slotId) {
        const el = document.getElementById('slot-settings-' + slotId);
        if (!el) return;
        if (!el.classList.contains('hidden')) { el.classList.add('hidden'); el.innerHTML = ''; return; }
        const slot = _slateData.find(s => s.id === slotId);
        if (!slot) return;
        let plats = [];
        try { plats = JSON.parse(slot.platforms || '[]'); } catch (e) { plats = []; }
        const checks = SLOT_PLATFORMS.map(p =>
            `<label class="text-xs text-gray-300 mr-3 whitespace-nowrap"><input type="checkbox" data-plat="${p}" ${plats.includes(p) ? 'checked' : ''} class="accent-accent"> ${p}</label>`
        ).join('');
        el.innerHTML = `
            <div class="bg-surface-light border border-gray-700 rounded-lg p-3 mb-3 space-y-2">
                <input type="text" data-f="label" value="${escapeHtml(slot.label || '')}"
                       class="w-full bg-surface rounded border border-gray-600 px-2 py-1 text-white text-sm" placeholder="Label">
                <div class="flex flex-wrap">${checks}</div>
                <div class="flex gap-2 items-center text-xs text-gray-400">
                    <label>max <input type="number" data-f="max_session_minutes" value="${slot.max_session_minutes ?? ''}" class="w-16 bg-surface rounded border border-gray-600 px-1 py-1 text-white"> min</label>
                    <label>min <input type="number" data-f="min_session_minutes" value="${slot.min_session_minutes ?? ''}" class="w-16 bg-surface rounded border border-gray-600 px-1 py-1 text-white"> min</label>
                </div>
                <div class="flex flex-col gap-1 text-xs text-gray-300">
                    <label><input type="checkbox" data-f="streamable_only" ${slot.streamable_only ? 'checked' : ''} class="accent-accent"> Streamable games only</label>
                    <label><input type="checkbox" data-f="prioritize_started" ${slot.prioritize_started ? 'checked' : ''} class="accent-accent"> Prioritize started games</label>
                </div>
                <label class="block text-xs text-gray-400">Focus series
                    <select data-f="focus_series_id" class="mt-1 w-full bg-surface rounded border border-gray-600 px-2 py-1 text-white text-xs">
                        <option value="">— none —</option>
                        ${_seriesList.map(s => `<option value="${s.id}" ${slot.focus_series_id === s.id ? 'selected' : ''}>${escapeHtml(s.name)}</option>`).join('')}
                    </select>
                </label>
                <textarea data-f="context_notes" rows="2" placeholder="Notes (used by the AI later)"
                          class="w-full bg-surface rounded border border-gray-600 px-2 py-1 text-white text-xs">${escapeHtml(slot.context_notes || '')}</textarea>
                <div class="flex gap-2">
                    <button onclick="saveSlot(${slotId})" class="px-2 py-1 bg-accent hover:bg-accent-hover rounded text-white text-xs">Save</button>
                    <button onclick="deleteSlot(${slotId})" class="px-2 py-1 bg-surface rounded text-red-300 hover:text-red-200 text-xs">Delete</button>
                </div>
            </div>`;
        el.classList.remove('hidden');
    }

    function _slotSettingsPayload(slotId) {
        const el = document.getElementById('slot-settings-' + slotId);
        const val = f => el.querySelector(`[data-f="${f}"]`);
        const platforms = Array.from(el.querySelectorAll('input[data-plat]')).filter(c => c.checked).map(c => c.dataset.plat);
        const maxv = val('max_session_minutes').value;
        const minv = val('min_session_minutes').value;
        return {
            label: val('label').value,
            platforms,
            max_session_minutes: maxv === '' ? null : parseInt(maxv, 10),
            min_session_minutes: minv === '' ? null : parseInt(minv, 10),
            streamable_only: val('streamable_only').checked ? 1 : 0,
            prioritize_started: val('prioritize_started').checked ? 1 : 0,
            context_notes: val('context_notes').value,
            focus_series_id: (() => { const v = val('focus_series_id').value; return v === '' ? null : parseInt(v, 10); })(),
        };
    }

    async function saveSlot(slotId) {
        await api.patch(`/api/slots/${slotId}`, _slotSettingsPayload(slotId));
        loadSlate();
    }
    async function deleteSlot(slotId) {
        await api.delete(`/api/slots/${slotId}`);
        loadSlate();
    }

    async function addSlot() {
        await api.post('/api/slots', { label: 'New slot', platforms: [] });
        loadSlate();
    }

    // ---- Decider chat ----
    const _deciderMessages = {};  // slotId -> [{role, content}, ...]

    function toggleDeciderChat(slotId) {
        const panel = document.getElementById('decider-chat-' + slotId);
        const btn = document.getElementById('decider-btn-' + slotId);
        if (!panel) return;
        const isOpen = panel.style.display === 'flex';
        if (isOpen) {
            panel.style.display = 'none';
            panel.classList.add('hidden');
            if (btn) btn.textContent = 'Help me decide';
        } else {
            panel.classList.remove('hidden');
            panel.style.display = 'flex';
            panel.style.flexDirection = 'column';
            panel.style.gap = '0.5rem';
            if (btn) btn.textContent = 'Close chat';
            const input = document.getElementById('decider-input-' + slotId);
            if (input) input.focus();
        }
    }

    function _deciderAppendMsg(slotId, role, html) {
        const box = document.getElementById('decider-msgs-' + slotId);
        if (!box) return;
        const div = document.createElement('div');
        if (role === 'user') {
            div.className = 'flex justify-end';
            div.innerHTML = `<span class="bg-accent/30 text-white rounded-lg px-2 py-1 max-w-[85%] break-words">${escapeHtml(html)}</span>`;
        } else if (role === 'assistant') {
            div.className = 'flex justify-start';
            div.innerHTML = `<span class="bg-surface-lighter text-gray-200 rounded-lg px-2 py-1 max-w-[85%] break-words">${escapeHtml(html)}</span>`;
        } else {
            // system/notice: full width
            div.innerHTML = html;
        }
        box.appendChild(div);
        box.scrollTop = box.scrollHeight;
        return div;
    }

    async function sendDeciderMessage(slotId) {
        const input = document.getElementById('decider-input-' + slotId);
        if (!input) return;
        const text = input.value.trim();
        if (!text) return;
        input.value = '';

        if (!_deciderMessages[slotId]) _deciderMessages[slotId] = [];
        _deciderMessages[slotId].push({ role: 'user', content: text });
        _deciderAppendMsg(slotId, 'user', text);

        // Show thinking placeholder
        const box = document.getElementById('decider-msgs-' + slotId);
        const thinking = document.createElement('div');
        thinking.className = 'flex justify-start';
        thinking.innerHTML = `<span class="bg-surface-lighter text-gray-500 rounded-lg px-2 py-1 italic">Thinking…</span>`;
        if (box) { box.appendChild(thinking); box.scrollTop = box.scrollHeight; }

        const res = await api.post(`/api/slots/${slotId}/chat`, { messages: _deciderMessages[slotId] });

        if (box && thinking.parentNode === box) box.removeChild(thinking);

        if (!res.ok) {
            const errCode = (res.data && res.data.error) || '';
            let noticeHtml;
            if (errCode === 'no_api_key') {
                noticeHtml = `<p class="text-yellow-400 text-xs">Add your Anthropic API key in <a href="/settings" class="underline hover:text-yellow-300">Settings</a>.</p>`;
            } else {
                noticeHtml = `<p class="text-red-400 text-xs">Something went wrong, try again.</p>`;
            }
            _deciderAppendMsg(slotId, 'notice', noticeHtml);
            // Remove the last user message from history so they can retry cleanly
            _deciderMessages[slotId].pop();
            return;
        }

        const reply = (res.data && res.data.reply) || '';
        const suggestions = (res.data && res.data.suggestions) || [];

        if (reply) {
            _deciderMessages[slotId].push({ role: 'assistant', content: reply });
            _deciderAppendMsg(slotId, 'assistant', reply);
        }

        if (suggestions.length) {
            const sugBox = document.createElement('div');
            sugBox.className = 'space-y-2 mt-1';
            sugBox.innerHTML = `<p class="text-gray-500 text-[10px] uppercase tracking-wide">Suggested picks</p>`;
            suggestions.forEach(game => {
                const wrapper = document.createElement('div');
                wrapper.className = 'flex items-center gap-2 bg-surface-lighter rounded-lg p-2';
                // Mini cover + title
                const coverHtml = game.cover_url
                    ? `<img src="${escapeHtml(game.cover_url)}" class="w-8 h-10 object-cover rounded flex-shrink-0 cursor-pointer" onclick="openModal(${game.id})">`
                    : `<div class="cover-placeholder w-8 h-10 rounded flex items-center justify-center flex-shrink-0 cursor-pointer text-sm" onclick="openModal(${game.id})">🎮</div>`;
                wrapper.innerHTML = `
                    ${coverHtml}
                    <span class="flex-1 min-w-0 text-xs text-gray-200 truncate cursor-pointer" onclick="openModal(${game.id})" title="${escapeHtml(game.title)}">${escapeHtml(game.title)}</span>
                    <button onclick="pinFromDecider(${slotId}, ${game.id})"
                            class="px-2 py-1 bg-accent hover:bg-accent-hover rounded text-white text-xs flex-shrink-0">Pin</button>`;
                sugBox.appendChild(wrapper);
            });
            if (box) { box.appendChild(sugBox); box.scrollTop = box.scrollHeight; }
        }
    }

    async function pinFromDecider(slotId, gameId) {
        await api.post(`/api/slots/${slotId}/pin`, { game_id: gameId });
        // Reset chat state for this slot before refreshing
        delete _deciderMessages[slotId];
        loadSlate();
    }

    document.addEventListener('DOMContentLoaded', loadSlate);
</script>
{% endblock %}
